<header class="header">
  <div class="header-left">
    <button
      type="button"
      class="menu-toggle"
      aria-label="Toggle navigation"
      aria-controls="app-sidebar"
      [attr.aria-expanded]="!(sidebarCollapsed$ | async)"
      (click)="toggleSidebar()"
    >
      <svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>
    <a routerLink="/dashboard" class="brand">
      <span class="brand-mark" aria-hidden="true">EA</span>
      <span class="app-title">Enterprise Admin Workspace</span>
    </a>
  </div>

  <div class="header-right">
    @if (user$ | async; as user) {
      <div class="user-menu">
        <div class="user-info">
          <span class="user-name">{{ user.name }}</span>
          <span class="user-role">{{ user.role | titlecase }}</span>
        </div>
        <span class="avatar" aria-hidden="true">{{ initials(user.name) }}</span>
      </div>
    }
  </div>
</header>
