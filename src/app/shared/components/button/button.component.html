<button
  [attr.type]="buttonType"
  [class]="classes"
  [disabled]="disabled || loading"
  [attr.aria-label]="ariaLabel"
  [attr.aria-busy]="loading || null"
  (click)="onClick($event)">
  @if (loading) {
    <span class="spinner" aria-hidden="true"></span>
  }
  <ng-content></ng-content>
</button>
