<div class="settings-page">
  <div class="page-header with-action">
    <div>
      <h1>Settings</h1>
      <p class="subtitle">Saved to localStorage and broadcast to other modules on every change</p>
    </div>
    <app-button type="secondary" (clicked)="reset()">Reset to defaults</app-button>
  </div>

  <div class="settings-content">
    <app-card title="Preferences" padding="medium">
      <div class="settings-group">
        @for (toggle of toggles; track toggle.key) {
          <div class="setting-item">
            <div class="setting-info">
              <label class="setting-label" [for]="'setting-' + toggle.key">{{ toggle.label }}</label>
              <p class="setting-description" [id]="'setting-' + toggle.key + '-desc'">{{ toggle.description }}</p>
            </div>
            <span class="toggle-switch">
              <input
                type="checkbox"
                role="switch"
                [id]="'setting-' + toggle.key"
                [attr.aria-describedby]="'setting-' + toggle.key + '-desc'"
                [(ngModel)]="settings[toggle.key]"
                (ngModelChange)="saveToggle(toggle.key, $event)"
              />
              <span class="toggle-slider" aria-hidden="true"></span>
            </span>
          </div>
        }
      </div>
    </app-card>

    <app-card title="Localization" padding="medium">
      <div class="localization-grid">
        <div class="form-field">
          <label class="setting-label" for="setting-language">Language</label>
          <select id="setting-language" class="form-input" [(ngModel)]="settings.language" (ngModelChange)="save({ language: $event })">
            @for (lang of languages; track lang.value) {
              <option [value]="lang.value">{{ lang.label }}</option>
            }
          </select>
        </div>

        <div class="form-field">
          <label class="setting-label" for="setting-timezone">Timezone</label>
          <select id="setting-timezone" class="form-input" [(ngModel)]="settings.timezone" (ngModelChange)="save({ timezone: $event })">
            @for (tz of timezones; track tz.value) {
              <option [value]="tz.value">{{ tz.label }}</option>
            }
          </select>
        </div>
      </div>

      <div class="preview">
        <span class="preview-label">Preview</span>
        <span class="preview-value">{{ preview }}</span>
      </div>
    </app-card>

    <p class="save-status" role="status" aria-live="polite">
      @if (savedAt) {
        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
        </svg>
        Saved at {{ savedAt | date: 'shortTime' }}
      } @else {
        Changes are saved automatically.
      }
    </p>
  </div>
</div>
